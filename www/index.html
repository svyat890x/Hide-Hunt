<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hide Hunt</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mut:#5d6b78;--ac:#e8590c;--hid:#2b7de9;--see:#d9480f;--grid:#d5dde4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--card:#1a242d;--tx:#eaf0f5;--mut:#9aa9b6;--ac:#ff8a3d;--hid:#5aa0ff;--see:#ff8a3d;--grid:#2c3a46}}
:root[data-theme="dark"]{--bg:#10171e;--card:#1a242d;--tx:#eaf0f5;--mut:#9aa9b6;--ac:#ff8a3d;--hid:#5aa0ff;--see:#ff8a3d;--grid:#2c3a46}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.scr{display:none;min-height:100%;max-width:480px;margin:0 auto;padding:20px;flex-direction:column;position:relative}
.scr.on{display:flex}
#home{justify-content:center;padding-bottom:18vh}
h1{font-size:44px;text-align:center;margin:0 0 28px}h1 span{color:var(--ac)}
h2{margin:0 0 14px}
button,input{font:inherit}
button{border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;background:var(--ac);color:#fff;width:100%;margin-bottom:12px}
button.sec{background:var(--grid);color:var(--tx)}
button:disabled{opacity:.45}
input[type=text]{width:100%;padding:16px;font-size:20px;border-radius:14px;border:2px solid var(--grid);background:var(--card);color:var(--tx);margin-bottom:12px}
#code{text-align:center;letter-spacing:6px;text-transform:uppercase;font-weight:700}
.err{color:#d00000;min-height:22px;margin-bottom:8px;font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pill{background:var(--card);border-radius:12px;padding:8px 14px;font-weight:700;letter-spacing:3px}
.chips{display:flex;gap:8px}
.chips button.chip{flex:1;width:auto;min-width:0;margin:0;padding:12px 4px;font-size:16px;background:var(--grid);color:var(--tx)}
.chips button.chip.sel{background:var(--ac);color:#fff}
.zone{display:flex;justify-content:center;align-items:center;height:130px}
.zone div{border:3px dashed var(--ac);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;transition:all .2s}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.team{background:var(--card);border-radius:16px;padding:12px;min-height:150px;border:2px solid transparent}
.team.over{border-color:var(--ac)}
.team h3{margin:0 0 8px;font-size:16px}
.team.h h3{color:var(--hid)}.team.s h3{color:var(--see)}
.pl{padding:10px 8px;margin-bottom:6px;border-radius:10px;background:var(--bg);user-select:none;-webkit-user-select:none}
.pl.me{font-weight:700}
.pl.mov{touch-action:none;cursor:grab}
.pl small{color:var(--mut);margin-left:4px}
.ghost{position:fixed;z-index:50;pointer-events:none;background:var(--ac);color:#fff;padding:10px 14px;border-radius:10px;font-weight:700;transform:translate(-50%,-50%);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.note{color:var(--mut);font-size:13px;text-align:center;margin-bottom:10px}
#gear{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:46px;height:46px;padding:0;margin:0;background:var(--card);color:var(--tx);display:flex;align-items:center;justify-content:center;border-radius:50%}
#lang{display:none;position:absolute;top:calc(68px + env(safe-area-inset-top,0px));right:14px;width:180px;background:var(--card);border-radius:14px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5}
#lang.on{display:block}
#lang button{margin:0 0 6px;padding:12px;font-size:16px}
#lang button:last-child{margin:0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:60;max-width:90%;text-align:center}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="perm" class="scr on" style="justify-content:center">
  <h1>Hide <span>Hunt</span></h1>
  <div class="card"><b data-i="permT"></b><p data-i="permP" style="margin:8px 0 0;color:var(--mut)"></p></div>
  <button id="pAllow" data-i="allow"></button>
  <button class="sec" id="pSkip" data-i="skip"></button>
</div>

<div id="home" class="scr">
  <button id="gear" aria-label="Language"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <div id="lang"><button class="sec" data-l="uk">Українська</button><button class="sec" data-l="en">English</button></div>
  <h1>Hide <span>Hunt</span></h1>
  <button id="bJoin" data-i="join"></button>
  <button id="bHost" class="sec" data-i="host"></button>
  <div class="note" id="mode"></div>
</div>

<div id="entry" class="scr">
  <h2 id="etitle"></h2>
  <input type="text" id="name" data-p="name" maxlength="14" autocomplete="off">
  <input type="text" id="code" maxlength="6" autocomplete="off">
  <div class="err" id="err"></div>
  <button id="go" data-i="next"></button>
  <button class="sec" id="back" data-i="back"></button>
</div>

<div id="lobby" class="scr">
  <div class="top"><h2 style="margin:0" data-i="lobby"></h2><div class="pill" id="lcode"></div></div>
  <div class="card">
    <b data-i="zone"></b>
    <div class="zone"><div id="zc"></div><canvas id="zp" width="520" height="260" style="display:none;width:260px;height:130px"></canvas></div><div class="note" id="zl"></div>
    <div class="chips" id="chips"></div>
    
  </div>
  <div class="card"><b data-i="dur"></b><div class="chips" style="align-items:center;margin-top:10px"><button class="chip" id="dM">−</button><b id="dv" style="flex:2;text-align:center;font-size:22px"></b><button class="chip" id="dP">+</button></div></div>
  <div class="note" data-i="drag"></div>
  <div class="teams">
    <div class="team h" data-t="h"><h3 data-i="hiders"></h3><div id="th"></div></div>
    <div class="team s" data-t="s"><h3 data-i="seekers"></h3><div id="ts"></div></div>
  </div>
  <button id="start" data-i="start"></button>
  <button class="sec" id="leave" data-i="leave"></button>
</div>
<div id="draw" class="scr">
  <h2 data-i="drawT"></h2><div class="note" data-i="drawH"></div>
  <canvas id="dcv" width="600" height="600" style="width:100%;aspect-ratio:1;border-radius:14px;touch-action:none;margin-bottom:12px"></canvas>
  <div class="chips" style="margin-bottom:12px"><button class="chip" id="bU" data-i="undo"></button><button class="chip" id="bC" data-i="clear"></button><button class="chip" id="bZm">−</button><button class="chip" id="bZp">+</button></div>
  <div class="note" id="gst"></div>
  
  <button id="dDone" data-i="done"></button>
  <button class="sec" id="dCancel" data-i="cancel"></button>
</div>
<div id="game" class="scr">
  <div class="top"><h2 style="margin:0" id="gteam"></h2><div class="pill" id="gcode"></div></div>
  <canvas id="gcv" width="600" height="600" style="width:100%;aspect-ratio:1;border-radius:14px;margin-bottom:10px"></canvas>
  <div class="note" id="gmsg" style="font-weight:600"></div>
  <button id="bShow" style="display:none"></button>
  <button class="sec" id="gEnd" data-i="endGame" style="display:none"></button>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const T={
uk:{join:'Приєднатись до гри',host:'Створити гру',name:'Твоє ім’я',codeJ:'ВВЕДИ КОД',codeH:'ПРИДУМАЙ КОД',next:'Далі',back:'Назад',nameErr:'Введи ім’я',codeErr:'Код мінімум 3 символи',nf:'Кімнату з таким кодом не знайдено',taken:'Цей код уже зайнятий, придумай інший',lobby:'Лобі',zone:'Зона гри',custom:'Свій',m:'м',drag:'Перетягуй імена пальцем між командами',hiders:'Hide',seekers:'Hunt',hostTag:'хост',start:'Почати гру',soon:'Далі зробимо сам процес гри: GPS, радар і пошук.',leave:'Вийти',closed:'Хост закрив кімнату',demo:'Демо-режим: лише цей пристрій',saveErr:'Не вдалося зберегти зміни',drawT:'Малюємо зону',drawH:'Торкайся поля, щоб ставити кути зони. Справжню карту підключимо в Android-версії.',undo:'Скасувати',clear:'Стерти',done:'Готово',cancel:'Відміна',minPts:'Постав щонайменше 3 точки',area:'Площа',gpsBtn:'Дозволити GPS',gpsOn:'GPS працює',gpsOff:'GPS недоступний на цьому пристрої',gpsDeny:'Доступ до GPS заборонено. Дозволь його в налаштуваннях.',permT:'Точна геолокація',permP:'Hide Hunt використовує твою точну геолокацію (GPS), щоб показувати зону гри та надсилати твою позицію у грі. Під час гри мисливці можуть на кілька секунд побачити приблизне місце твого знаходження.',allow:'Дозволити геолокацію',skip:'Не зараз',show:'Show',showing:'Показуємо',shown:'Мисливці щойно побачили твою приблизну геолокацію!',endGame:'Завершити гру',gHide:'Ти ховаєшся',gHunt:'Ти шукаєш',waitGps:'Чекаємо GPS…',outside:'Ти поза зоною гри!',needGps:'Увімкни GPS і дозволь доступ до геолокації, щоб почати гру',dur:'Тривалість раунду',min:'хв',timeUp:'Час вийшов!',needJoin:'Дозволь доступ до геолокації, щоб створити або приєднатись до гри'},
en:{join:'Join Game',host:'Host Game',name:'Your name',codeJ:'ENTER CODE',codeH:'CREATE CODE',next:'Next',back:'Back',nameErr:'Enter your name',codeErr:'Code needs at least 3 characters',nf:'No room found with this code',taken:'This code is already taken, pick another',lobby:'Lobby',zone:'Game zone',custom:'Custom',m:'m',drag:'Drag names between teams with your finger',hiders:'Hide',seekers:'Hunt',hostTag:'host',start:'Start game',soon:'Next we will build the game itself: GPS, radar and searching.',leave:'Leave',closed:'The host closed the room',demo:'Demo mode: this device only',saveErr:'Could not save changes',drawT:'Draw the zone',drawH:'Tap the field to place zone corners. A real map comes with the Android version.',undo:'Undo',clear:'Clear',done:'Done',cancel:'Cancel',minPts:'Place at least 3 points',area:'Area',gpsBtn:'Allow GPS',gpsOn:'GPS is on',gpsOff:'GPS is not available on this device',gpsDeny:'GPS access was denied. Allow it in settings.',permT:'Precise location',permP:'Hide Hunt uses your precise GPS location to show the game zone and to send your position during the game. While playing, hunters can briefly see your approximate location.',allow:'Allow location',skip:'Not now',show:'Show',showing:'Showing',shown:'The hunters just saw your approximate location!',endGame:'End game',gHide:'You are hiding',gHunt:'You are hunting',waitGps:'Waiting for GPS…',outside:'You are outside the zone!',needGps:'Turn on GPS and allow location access to start the game',dur:'Round time',min:'min',timeUp:'Time’s up!',needJoin:'Allow location access to host or join a game'}};
let lang='en';try{lang=localStorage.getItem('hh_lang')||'en'}catch(e){}
const t=k=>T[lang][k];
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
  $('code').placeholder=t(mode==='join'?'codeJ':'codeH');
  $('etitle').textContent=t(mode==='join'?'join':'host');
  if(storeIsLocal)$('mode').textContent=t('demo');
  if(room)render();
}
$('gear').onclick=()=>$('lang').classList.toggle('on');
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{
  lang=b.dataset.l;try{localStorage.setItem('hh_lang',lang)}catch(e){}
  $('lang').classList.remove('on');applyLang();
});
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}

const TEST_MODE=true; // true = можна входити без GPS (для тесту). Для справжньої гри постав false
const gpsOk=()=>TEST_MODE||!!gpos;
const PRESETS=[150,350,500];
const me={id:Math.random().toString(36).slice(2,10),name:'',host:false};
let code='',room=null,unsub=null,store=null,mode='host',storeIsLocal=true,seen=false,dragging=false,lastS='';

// ---- сховище: спільна база (db) або локальна демо-пам’ять ----
const mem={},listeners={};
const local={
  async get(c){return mem[c]?JSON.parse(JSON.stringify(mem[c])):null},
  async set(c,d){mem[c]=JSON.parse(JSON.stringify(d));(listeners[c]||[]).forEach(f=>f(mem[c]))},
  async del(c){delete mem[c];(listeners[c]||[]).forEach(f=>f(null))},
  sub(c,f){(listeners[c]=listeners[c]||[]).push(f);f(mem[c]||null);return()=>{listeners[c]=listeners[c].filter(x=>x!==f)}}
};
store=local;
// ---- Firebase (спільна база для гри на різних телефонах) ----
const FIREBASE_CONFIG={apiKey:"AIzaSyBH6YrBOgn0KWoDP8LGTImso0fvcYy8RqI",authDomain:"hide-hunt-409f8.firebaseapp.com",projectId:"hide-hunt-409f8",storageBucket:"hide-hunt-409f8.firebasestorage.app",messagingSenderId:"211485619450",appId:"1:211485619450:web:8e87cf704641d39678c543"};
function initFirebase(){
  try{
    if(window.firebase&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.apiKey!=="PASTE_HERE"){
      firebase.initializeApp(FIREBASE_CONFIG);
      const f=firebase.firestore();
      f.settings({experimentalAutoDetectLongPolling:true,merge:true});
      return f;
    }
  }catch(e){console.error(e)}
  return null;
}
(async()=>{
  try{
    const db=initFirebase();
    if(db){
      storeIsLocal=false;
      store={
        async get(c){const s=await db.doc('rooms/'+c).get();return s.exists?s.data():null},
        async set(c,d){await db.doc('rooms/'+c).set(d)},
        async del(c){await db.doc('rooms/'+c).delete()},
        sub(c,f){return db.doc('rooms/'+c).onSnapshot(s=>f(s.exists?s.data():null))}
      };
      $('mode').textContent='';
    }
  }catch(e){}
  applyLang();
})();

const shp=r=>{try{return r&&r.shape&&r.shape.j?JSON.parse(r.shape.j):null}catch(e){return null}};
function merge(a,b){
  const z=(b.zt||0)>(a.zt||0)?b:a,pick=k=>{const x=a[k],y=b[k];return !x?y:!y?x:((y.t||0)>(x.t||0)?y:x)},out={host:a.host||b.host,radius:z.radius,custom:z.custom,shape:z.shape||null,zt:z.zt||0,dur:z.dur||30,game:pick('game')||null,show:pick('show')||null,players:{}};
  const ids=new Set([...Object.keys(a.players||{}),...Object.keys(b.players||{})]);
  ids.forEach(id=>{const p=(a.players||{})[id],q=(b.players||{})[id];out.players[id]=!p?q:!q?p:((q.t||0)>(p.t||0)?q:p)});
  return out;
}
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id))}
const needG=()=>{toast(t('needJoin'));startGps()};
$('bJoin').onclick=()=>{if(!gpsOk())return needG();openEntry('join')};
$('bHost').onclick=()=>{if(!gpsOk())return needG();openEntry('host')};
$('back').onclick=()=>show('home');
function openEntry(m){mode=m;$('err').textContent='';applyLang();show('entry')}

$('go').onclick=async()=>{
  const n=$('name').value.trim(),c=$('code').value.trim().toUpperCase();
  if(!n){$('err').textContent=t('nameErr');return}
  if(c.length<3){$('err').textContent=t('codeErr');return}
  me.name=n;
  try{
    const ex=await store.get(c);
    if(mode==='join'){
      if(!ex){$('err').textContent=t('nf');return}
      code=c;me.host=false;room=ex;
      ex.players[me.id]={name:n,team:'h',t:Date.now()};await store.set(c,ex);
    }else{
      if(ex){$('err').textContent=t('taken');return}
      code=c;me.host=true;
      room={host:me.id,radius:350,custom:false,shape:null,zt:0,players:{[me.id]:{name:n,team:'h',t:Date.now()}}};
      await store.set(c,room);
    }
  }catch(e){$('err').textContent=t('saveErr');return}
  $('lcode').textContent=code;seen=false;show('lobby');startGps();
  unsub&&unsub();
  unsub=store.sub(code,d=>{
    if(d){seen=true;if(dragging)return;const m=room?merge(room,d):d;const sj=JSON.stringify(m);if(sj===lastS)return;lastS=sj;room=m;setTimeout(syncGame,0);
      
      render();
    }else if(seen&&!me.host){toast(t('closed'));goHome()}
  });
  render();
};

function goHome(){clearInterval(gtimer);clearInterval(ptimer);unsub&&unsub();unsub=null;room=null;code='';seen=false;show('home')}

async function mutate(fn){
  if(!room)return;
  const next=JSON.parse(JSON.stringify(room));fn(next);room=next;render();syncGame();
  try{
    let cur=await store.get(code);
    if(!cur){if(!me.host)return;cur=next}else cur=merge(cur,next);
    await store.set(code,cur);
  }catch(e){toast(t('saveErr')+' ('+((e&&(e.code||e.message))||'?')+')')}
}

function render(){
  if(!room||!$('lobby').classList.contains('on'))return;
  const r=room.radius,S=room.custom?shp(room):null,sh=S&&S.pts;
  $('zc').style.display=sh?'none':'flex';$('zp').style.display=sh?'block':'none';
  if(sh){drawPrev(S);$('zl').textContent=t('area')+': '+areaTxt(S)}
  else{const sz=Math.round(60+r/500*50);$('zc').style.width=$('zc').style.height=sz+'px';$('zc').textContent=r+' '+t('m');$('zl').textContent=''}
  const ch=$('chips');ch.innerHTML='';
  PRESETS.forEach(p=>ch.appendChild(chip(p+' '+t('m'),!sh&&r===p,()=>setZone(p))));
  ch.appendChild(chip(t('custom'),!!sh,openDraw));
  $('th').innerHTML='';$('ts').innerHTML='';
  Object.entries(room.players).forEach(([id,p])=>{if(p.left)return;
    const d=document.createElement('div');
    const mov=me.host||id===me.id;
    d.className='pl'+(id===me.id?' me':'')+(mov?' mov':'');
    d.textContent=p.name;
    if(id===room.host){const s=document.createElement('small');s.textContent='('+t('hostTag')+')';d.appendChild(s)}
    if(mov)d.addEventListener('pointerdown',e=>startDrag(e,id,p.name));
    $(p.team==='h'?'th':'ts').appendChild(d);
  });
  $('start').style.display=me.host?'block':'none';$('dv').textContent=(room.dur||30)+' '+t('min');$('dM').disabled=$('dP').disabled=!me.host;
}
function chip(txt,sel,f){
  const b=document.createElement('button');b.type='button';
  b.className='chip'+(sel?' sel':'');b.textContent=txt;
  b.disabled=!me.host;b.addEventListener('click',f);return b;
}
const setZone=r=>mutate(x=>{x.radius=r;x.custom=false;x.shape=null;x.zt=Date.now()});
// ---- малювання своєї зони ----
let dpts=[],dview=1000,dorig=null;const VIEWS=[300,600,1000,2000,4000];
function areaM(p){let a=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1]}return Math.abs(a)/2}
function areaTxt(sh){const a=areaM(sh.pts);return a>=100000?(a/1e6).toFixed(2)+' km²':Math.round(a)+' m²'}
function drawPrev(sh){
  const cv=$('zp'),c=cv.getContext('2d'),W=cv.width,H=cv.height,p=sh.pts;
  c.clearRect(0,0,W,H);
  const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const s=Math.min((W-30)/Math.max(1,maxx-minx),(H-30)/Math.max(1,maxy-miny));
  const ox=W/2-(minx+maxx)/2*s,oy=H/2+(miny+maxy)/2*s;
  c.beginPath();p.forEach((q,i)=>{const x=ox+q[0]*s,y=oy-q[1]*s;i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath();
  c.fillStyle='rgba(232,89,12,.3)';c.fill();c.strokeStyle='#e8590c';c.lineWidth=4;c.stroke();
}
let gpos=null,gwatch=null;
function startGps(){
  if(!navigator.geolocation){$('gst').textContent=t('gpsOff');return}
  if(gwatch!==null)return;
  gwatch=navigator.geolocation.watchPosition(p=>{
    gpos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
    if(!dorig&&!dpts.length)dorig={lat:gpos.lat,lon:gpos.lon};
    $('gst').textContent=t('gpsOn')+' ±'+Math.round(gpos.acc)+' '+t('m');
    
    if($('draw').classList.contains('on'))drawCv();
  },e=>{
    navigator.geolocation.clearWatch(gwatch);gwatch=null;
    $('gst').textContent=e.code===1?t('gpsDeny'):t('gpsOff');
  },{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
}

function openDraw(){
  if(!me.host)return;
  const S0=shp(room);dpts=S0&&S0.pts?S0.pts.map(q=>q.slice()):[];dview=1000;dorig=S0?S0.orig:null;
  show('draw');drawCv();
  startGps();if(!dorig&&gpos)dorig={lat:gpos.lat,lon:gpos.lon};
}
function drawCv(){
  const cv=$('dcv'),c=cv.getContext('2d'),W=cv.width,h=W/2,s=W/dview,cs=getComputedStyle(document.documentElement);
  c.fillStyle=cs.getPropertyValue('--card');c.fillRect(0,0,W,W);
  const step=dview<=600?50:dview<=1000?100:dview<=2000?250:500;
  c.strokeStyle=cs.getPropertyValue('--grid');c.lineWidth=1;
  for(let m=-Math.floor(dview/2/step)*step;m<=dview/2;m+=step){const q=h+m*s;c.beginPath();c.moveTo(q,0);c.lineTo(q,W);c.moveTo(0,q);c.lineTo(W,q);c.stroke()}
  c.fillStyle=cs.getPropertyValue('--mut');c.font='22px system-ui';c.fillText(step+' '+t('m'),10,28);
  if(dpts.length){
    c.beginPath();dpts.forEach((q,i)=>{const x=h+q[0]*s,y=h-q[1]*s;i?c.lineTo(x,y):c.moveTo(x,y)});
    if(dpts.length>2){c.closePath();c.fillStyle='rgba(232,89,12,.25)';c.fill()}
    c.strokeStyle='#e8590c';c.lineWidth=4;c.stroke();
    dpts.forEach(q=>{c.beginPath();c.arc(h+q[0]*s,h-q[1]*s,9,0,7);c.fillStyle='#e8590c';c.fill()});
  }
  let ux=0,uy=0,ur=10;
  if(gpos&&dorig){const k=Math.PI/180;ux=(gpos.lon-dorig.lon)*k*6371000*Math.cos(dorig.lat*k);uy=(gpos.lat-dorig.lat)*k*6371000;ur=Math.max(10,gpos.acc*s)}
  c.fillStyle='rgba(30,120,255,.2)';c.beginPath();c.arc(h+ux*s,h-uy*s,ur,0,7);c.fill();
  c.fillStyle='#1e78ff';c.beginPath();c.arc(h+ux*s,h-uy*s,10,0,7);c.fill();
}
$('dcv').addEventListener('pointerdown',e=>{
  const cv=$('dcv'),r=cv.getBoundingClientRect(),W=cv.width,s=W/dview;
  const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*W;
  const k=dpts.findIndex(q=>Math.hypot(W/2+q[0]*s-x,W/2-q[1]*s-y)<28);
  if(k>=0)dpts.splice(k,1);else dpts.push([Math.round((x-W/2)/s),Math.round(-(y-W/2)/s)]);drawCv();
});
$('bU').onclick=()=>{dpts.pop();drawCv()};
$('bC').onclick=()=>{dpts=[];drawCv()};
$('bZm').onclick=()=>{const i=VIEWS.indexOf(dview);if(i<VIEWS.length-1){dview=VIEWS[i+1];drawCv()}};
$('bZp').onclick=()=>{const i=VIEWS.indexOf(dview);if(i>0){dview=VIEWS[i-1];drawCv()}};
$('dCancel').onclick=()=>show('lobby');
$('dDone').onclick=()=>{
  if(dpts.length<3){toast(t('minPts'));return}
  const pts=dpts.map(q=>q.slice()),orig=dorig||null,rad=Math.round(Math.max(...pts.map(q=>Math.hypot(q[0],q[1]))));
  show('lobby');mutate(x=>{x.custom=true;x.shape={j:JSON.stringify({pts,orig})};x.radius=rad;x.zt=Date.now()});
};

// ---- перетягування гравців між командами ----
function startDrag(e,id,name){
  e.preventDefault();
  dragging=true;const g=document.createElement('div');g.className='ghost';g.textContent=name;document.body.appendChild(g);
  const move=ev=>{
    g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';
    const tm=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.team');
    document.querySelectorAll('.team').forEach(x=>x.classList.toggle('over',x===tm));
  };
  const up=ev=>{
    window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    const tm=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.team');
    dragging=false;setTimeout(render,0);g.remove();document.querySelectorAll('.team').forEach(x=>x.classList.remove('over'));
    if(tm&&room.players[id]&&room.players[id].team!==tm.dataset.t){const nt=tm.dataset.t;mutate(x=>{if(x.players[id]){x.players[id].team=nt;x.players[id].t=Date.now()}})}
  };
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  move(e);
}

// ---- переддозвіл на GPS ----
$('pAllow').onclick=()=>{startGps();show('home')};
$('pSkip').onclick=()=>show('home');

// ---- гра ----
const SHOW_MS=20000,COOL_MS=60000;
let gtimer=null,ptimer=null,showUntil=0,lastShowT=0,nextShow=0,ended=false;
const myTeam=()=>{const p=room&&room.players[me.id];return p?p.team:'h'};
function rel(p,c){const k=Math.PI/180;return[(p.lon-c.lon)*k*6371000*Math.cos(c.lat*k),(p.lat-c.lat)*k*6371000]}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function inside(x,y){
  const S=room.custom?shp(room):null;
  if(S&&S.pts){let ins=false;const p=S.pts;for(let i=0,j=p.length-1;i<p.length;j=i++){if((p[i][1]>y)!==(p[j][1]>y)&&x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0])ins=!ins}return ins}
  return Math.hypot(x,y)<=room.radius;
}
function syncGame(){
  if(!room)return;
  const g=room.game,on=g&&g.on,cur=document.querySelector('.scr.on'),scr=cur&&cur.id;
  if(on&&(scr==='lobby'||scr==='draw'))enterGame();
  if(!on&&scr==='game')leaveGame();
  const s=room.show;
  if(on&&s&&s.t!==lastShowT){
    lastShowT=s.t;
    if(s.g===g.t){showUntil=Date.now()+SHOW_MS;nextShow=Date.now()+COOL_MS;if(myTeam()==='h')toast(t('shown'))}
  }
}
function enterGame(){
  lastShowT=room.show?room.show.t:0;showUntil=0;ended=false;
  $('gcode').textContent=code;$('gEnd').style.display=me.host?'block':'none';
  show('game');startGps();
  clearInterval(gtimer);clearInterval(ptimer);
  gtimer=setInterval(gameTick,500);ptimer=setInterval(pushPos,5000);pushPos();gameTick();
}
function leaveGame(){clearInterval(gtimer);clearInterval(ptimer);show('lobby');render()}
function pushPos(){
  if(!gpos||!room||!room.game||!room.game.on)return;
  const now=Date.now();
  mutate(x=>{const p=x.players[me.id];if(p){p.lat=gpos.lat;p.lon=gpos.lon;p.t=now}});
}
function gameTick(){
  if(!room||!room.game||!room.game.on)return;
  const cv=$('gcv'),c=cv.getContext('2d'),W=cv.width,h=W/2,cs=getComputedStyle(document.documentElement),C=room.game.c,mt=myTeam();
  c.fillStyle=cs.getPropertyValue('--card');c.fillRect(0,0,W,W);
  const S=room.custom?shp(room):null;
  let R=room.radius;if(S&&S.pts)R=Math.max(50,...S.pts.map(q=>Math.hypot(q[0],q[1])));
  const s=(W*0.42)/R;
  c.strokeStyle=cs.getPropertyValue('--grid');c.lineWidth=1;
  [0.5,1].forEach(k=>{c.beginPath();c.arc(h,h,R*k*s,0,7);c.stroke()});
  c.beginPath();c.moveTo(h,0);c.lineTo(h,W);c.moveTo(0,h);c.lineTo(W,h);c.stroke();
  c.strokeStyle='#e8590c';c.lineWidth=4;c.setLineDash([12,8]);c.beginPath();
  if(S&&S.pts){S.pts.forEach((q,i)=>{const x=h+q[0]*s,y=h-q[1]*s;if(i)c.lineTo(x,y);else c.moveTo(x,y)});c.closePath()}
  else c.arc(h,h,R*s,0,7);
  c.stroke();c.setLineDash([]);
  let msg=t('waitGps');
  if(C){
    const now=Date.now(),showing=now<showUntil;
    Object.entries(room.players).forEach(([id,p])=>{
      if(id===me.id||p.left||p.lat==null)return;
      const [x,y]=rel(p,C);
      if(p.team===mt){
        c.fillStyle=mt==='s'?'#d9480f':'#2b7de9';c.beginPath();c.arc(h+x*s,h-y*s,9,0,7);c.fill();
        c.fillStyle=cs.getPropertyValue('--tx');c.font='bold 22px system-ui';c.textAlign='center';c.fillText(p.name,h+x*s,h-y*s-16);
      }else if(mt==='s'&&showing&&p.team==='h'){
        const sd=hash(id+(room.show?room.show.t:0)),a=(sd%360)*Math.PI/180,d=(sd>>3)%40;
        const fx=h+(x+Math.cos(a)*d)*s,fy=h-(y+Math.sin(a)*d)*s;
        c.fillStyle='rgba(43,125,233,.28)';c.strokeStyle='#2b7de9';c.lineWidth=3;
        c.beginPath();c.arc(fx,fy,Math.max(18,70*s),0,7);c.fill();c.stroke();
        c.fillStyle=cs.getPropertyValue('--tx');c.font='bold 22px system-ui';c.textAlign='center';c.fillText(p.name,fx,fy+7);
      }
    });
    if(gpos){
      const [ux,uy]=rel(gpos,C);
      c.fillStyle='rgba(30,120,255,.2)';c.beginPath();c.arc(h+ux*s,h-uy*s,Math.max(10,gpos.acc*s),0,7);c.fill();
      c.fillStyle='#1e78ff';c.strokeStyle='#fff';c.lineWidth=4;c.beginPath();c.arc(h+ux*s,h-uy*s,11,0,7);c.fill();c.stroke();
      msg=inside(ux,uy)?t(mt==='s'?'gHunt':'gHide'):t('outside');
    }
  }
  const gg=room.game,rem=Math.max(0,(gg.dur||30)*60000-(Date.now()-gg.t));
  const mm=Math.floor(rem/60000),ss=Math.floor(rem%60000/1000);
  $('gteam').textContent=(mt==='s'?'Hunt':'Hide')+' · '+mm+':'+String(ss).padStart(2,'0');
  if(rem<=0){msg=t('timeUp');if(me.host&&!ended){ended=true;toast(t('timeUp'));mutate(x=>{x.game={on:false,t:Date.now(),c:null}})}}
  $('gmsg').textContent=msg;
  const b=$('bShow');b.style.display=mt==='s'?'block':'none';
  const now2=Date.now();
  if(now2<showUntil){b.disabled=true;b.textContent=t('showing')+' '+Math.ceil((showUntil-now2)/1000)+' s'}
  else if(now2<nextShow){b.disabled=true;b.textContent=t('show')+' ('+Math.ceil((nextShow-now2)/1000)+' s)'}
  else{b.disabled=false;b.textContent=t('show')}
}
$('bShow').onclick=()=>{
  if(Date.now()<nextShow||!room||!room.game)return;
  nextShow=Date.now()+COOL_MS;
  mutate(x=>{x.show={t:Date.now(),g:x.game.t}});
};
$('start').onclick=()=>{
  if(!gpsOk()){toast(t('needGps'));startGps();return}
  const S=room.custom?shp(room):null;
  const c=(S&&S.orig)||(gpos?{lat:gpos.lat,lon:gpos.lon}:null);
  mutate(x=>{x.game={on:true,t:Date.now(),c,dur:room.dur||30}});
};
$('gEnd').onclick=()=>mutate(x=>{x.game={on:false,t:Date.now(),c:null}});
$('dM').onclick=()=>mutate(x=>{x.dur=Math.max(5,(x.dur||30)-5);x.zt=Date.now()});
$('dP').onclick=()=>mutate(x=>{x.dur=Math.min(180,(x.dur||30)+5);x.zt=Date.now()});
$('leave').onclick=async()=>{
  const c=code,h=me.host;goHome();
  try{
    if(h)await store.del(c);
    else{const cur=await store.get(c);if(cur){cur.players[me.id]={name:me.name,team:'h',left:true,t:Date.now()};await store.set(c,cur)}}
  }catch(e){}
};
window.addEventListener('pagehide',()=>{if(me.host&&code)try{store.del(code)}catch(e){}});
applyLang();
</script>
