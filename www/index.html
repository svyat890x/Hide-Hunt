<!DOCTYPE html>
<html lang="en" class="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hide Hunt</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mut:#5d6b78;--ac:#e8590c;--hid:#2b7de9;--see:#d9480f;--grid:#d5dde4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--card:#1a242d;--tx:#eaf0f5;--mut:#9aa9b6;--ac:#ff8a3d;--hid:#5aa0ff;--see:#ff8a3d;--grid:#2c3a46}}
:root[data-theme="dark"]{--bg:#10171e;--card:#1a242d;--tx:#eaf0f5;--mut:#9aa9b6;--ac:#ff8a3d;--hid:#5aa0ff;--see:#ff8a3d;--grid:#2c3a46}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.scr{display:none;min-height:100%;max-width:480px;margin:0 auto;padding:20px;flex-direction:column;position:relative}
.scr.on{display:flex}
#home{justify-content:center;padding-bottom:18vh}
h1{font-size:44px;text-align:center;margin:0 0 28px}h1 span{color:var(--ac)}
h2{margin:0 0 14px}
button,input{font:inherit}
button{border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;background:var(--ac);color:#fff;width:100%;margin-bottom:12px}
button.sec{background:var(--grid);color:var(--tx)}
button:disabled{opacity:.45}
input[type=text]{width:100%;padding:16px;font-size:20px;border-radius:14px;border:2px solid var(--grid);background:var(--card);color:var(--tx);margin-bottom:12px}
#code{text-align:center;letter-spacing:6px;text-transform:uppercase;font-weight:700}
.err{color:#d00000;min-height:22px;margin-bottom:8px;font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pill{background:var(--card);border-radius:12px;padding:8px 14px;font-weight:700;letter-spacing:3px}
.chips{display:flex;gap:8px}
.chips button.chip{flex:1;width:auto;min-width:0;margin:0;padding:12px 4px;font-size:16px;background:var(--grid);color:var(--tx)}
.chips button.chip.sel{background:var(--ac);color:#fff}
.zone{display:flex;justify-content:center;align-items:center;height:130px}
.zone div{border:3px dashed var(--ac);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;transition:all .2s}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.team{background:var(--card);border-radius:16px;padding:12px;min-height:150px;border:2px solid transparent}
.team.over{border-color:var(--ac)}
.team h3{margin:0 0 8px;font-size:16px}
.team.h h3{color:var(--hid)}.team.s h3{color:var(--see)}
.pl{padding:10px 8px;margin-bottom:6px;border-radius:10px;background:var(--bg);user-select:none;-webkit-user-select:none}
.pl.me{font-weight:700}
.pl.mov{touch-action:none;cursor:grab}
.pl small{color:var(--mut);margin-left:4px}
.ghost{position:fixed;z-index:50;pointer-events:none;background:var(--ac);color:#fff;padding:10px 14px;border-radius:10px;font-weight:700;transform:translate(-50%,-50%);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.note{color:var(--mut);font-size:13px;text-align:center;margin-bottom:10px}
#gear{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:46px;height:46px;padding:0;margin:0;background:var(--card);color:var(--tx);display:flex;align-items:center;justify-content:center;border-radius:50%}
#lang{display:none;position:absolute;top:calc(68px + env(safe-area-inset-top,0px));right:14px;width:180px;background:var(--card);border-radius:14px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5}
#lang.on{display:block}
#lang button{margin:0 0 6px;padding:12px;font-size:16px}
#lang button:last-child{margin:0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:60;max-width:90%;text-align:center}
.map{position:relative;z-index:0;width:100%;height:min(58vh,480px);border-radius:14px;margin-bottom:12px;background:var(--card)}
.pt{width:26px;height:26px;border-radius:50%;background:#e8590c;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pd{width:18px;height:18px;border-radius:50%;border:2px solid #fff}
.pd b{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;color:var(--tx);text-shadow:0 0 3px var(--card),0 0 3px var(--card),0 0 3px var(--card)}
#oob{display:none;position:fixed;inset:0;z-index:55;background:rgba(220,20,20,.5);flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;font-size:24px;font-weight:800;padding:24px;pointer-events:none}
#oob span{font-size:84px;line-height:1.1}
.mod{display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:20px}
#pickL button{margin-bottom:8px}
#seen{display:none;position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:59;background:#e8590c;color:#fff;padding:12px 16px;border-radius:12px;text-align:center;font-weight:700}
#ban{display:none;position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:58;background:#c92a2a;color:#fff;padding:12px 16px;border-radius:12px;text-align:center;font-weight:700}
#warn{display:none;position:fixed;left:12px;right:12px;bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:57;background:#e8590c;color:#fff;padding:12px 16px;border-radius:12px;text-align:center;font-weight:700}
.hd{width:56px;height:56px;pointer-events:none}
#snd{display:none;position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:40px;height:40px;padding:0;margin:0;border-radius:50%;z-index:56;align-items:center;justify-content:center;background:var(--card);color:var(--tx);border:2px solid var(--grid)}
#snd.on{display:flex}
#game{padding-bottom:72px}
html.bnd[class]{--bg:#000;--card:rgba(0,0,0,.8);--tx:#fff;--mut:#e2e2e2;--ac:#d00000;--hid:#ff6b6b;--see:#ff6b6b;--grid:#2a0000}

const t=k=>T[lang][k];
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
  $('code').placeholder=t(mode==='join'?'codeJ':'codeH');
  $('etitle').textContent=t(mode==='join'?'join':'host');
  if(storeIsLocal)$('mode').textContent=t('demo');
  themeUI();
  if(room)render();
}
let theme=null;try{theme=localStorage.getItem('hh_theme')}catch(e){}
if(!theme)theme='dark';
if(theme)document.documentElement.dataset.theme=theme;
const isDark=()=>theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function mapTheme(m){
  if(!m||!m.ready)return;const d=isDark();
  if(document.documentElement.classList.contains('bnd')){m.setPaintProperty('bg','background-color','#1a0505');m.setPaintProperty('w','fill-color','#000');m.setPaintProperty('r','line-color','#a31515');return}
  m.setPaintProperty('bg','background-color',d?'#161e26':'#eef1f4');
  m.setPaintProperty('w','fill-color',d?'#0c1217':'#cfdae4');
  m.setPaintProperty('r','line-color',d?'#68788a':'#a9b4bf');
}
function themeUI(){$('thBtn').textContent=t(isDark()?'themeL':'themeD')}
$('thBtn').onclick=()=>{
  theme=isDark()?'light':'dark';document.documentElement.dataset.theme=theme;
  try{localStorage.setItem('hh_theme',theme)}catch(e){}
  $('lang').classList.remove('on');themeUI();mapTheme(dmap);mapTheme(gmap);
};
$('gear').onclick=()=>$('lang').classList.toggle('on');
document.querySelectorAll('#lang button[data-l]').forEach(b=>b.onclick=()=>{
  lang=b.dataset.l;try{localStorage.setItem('hh_lang',lang)}catch(e){}
  $('lang').classList.remove('on');applyLang();
});
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}

const TEST_MODE=true; // true = можна входити без GPS (для тесту). Для справжньої гри постав false
const gpsOk=()=>TEST_MODE||!!gpos;
const PRESETS=[150,350,500];
const me={id:Math.random().toString(36).slice(2,10),name:'',host:false};
let code='',room=null,unsub=null,store=null,mode='host',storeIsLocal=true,seen=false,dragging=false,lastS='';

// ---- сховище: спільна база (db) або локальна демо-пам’ять ----
const mem={},listeners={};
const local={
  async get(c){return mem[c]?JSON.parse(JSON.stringify(mem[c])):null},
  async set(c,d){mem[c]=JSON.parse(JSON.stringify(d));(listeners[c]||[]).forEach(f=>f(mem[c]))},
  async del(c){delete mem[c];(listeners[c]||[]).forEach(f=>f(null))},
  sub(c,f){(listeners[c]=listeners[c]||[]).push(f);f(mem[c]||null);return()=>{listeners[c]=listeners[c].filter(x=>x!==f)}}
};
store=local;
// ---- Firebase (спільна база для гри на різних телефонах) ----
const FIREBASE_CONFIG={apiKey:"AIzaSyBH6YrBOgn0KWoDP8LGTImso0fvcYy8RqI",authDomain:"hide-hunt-409f8.firebaseapp.com",projectId:"hide-hunt-409f8",storageBucket:"hide-hunt-409f8.firebasestorage.app",messagingSenderId:"211485619450",appId:"1:211485619450:web:8e87cf704641d39678c543"};
function initFirebase(){
  try{
    if(window.firebase&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.apiKey!=="PASTE_HERE"){
      firebase.initializeApp(FIREBASE_CONFIG);
      const f=firebase.firestore();
      f.settings({experimentalAutoDetectLongPolling:true,merge:true});
      return f;
    }
  }catch(e){console.error(e)}
  return null;
}
(async()=>{
  try{
    const db=initFirebase();
    if(db){
      storeIsLocal=false;
      store={
        async get(c){const s=await db.doc('rooms/'+c).get();return s.exists?s.data():null},
        async set(c,d){await db.doc('rooms/'+c).set(d)},
        async del(c){await db.doc('rooms/'+c).delete()},
        sub(c,f){return db.doc('rooms/'+c).onSnapshot(s=>f(s.exists?s.data():null))}
      };
      $('mode').textContent='';
    }
  }catch(e){}
  applyLang();
})();

const shp=r=>{try{return r&&r.shape&&r.shape.j?JSON.parse(r.shape.j):null}catch(e){return null}};
const hbm=(x,y)=>{const o={...(x||{})};Object.entries(y||{}).forEach(([k,v])=>{if(!(o[k]>=v))o[k]=v});return o};
function merge(a,b){
  const z=(b.zt||0)>(a.zt||0)?b:a,pick=k=>{const x=a[k],y=b[k];return !x?y:!y?x:((y.t||0)>(x.t||0)?y:x)},out={host:a.host||b.host,radius:z.radius,custom:z.custom,shape:z.shape||null,zt:z.zt||0,dur:z.dur||30,sr:z.sr||70,game:pick('game')||null,show:pick('show')||null,req:pick('req')||null,frz:pick('frz')||null,hb:hbm(a.hb,b.hb),players:{}};
  const ids=new Set([...Object.keys(a.players||{}),...Object.keys(b.players||{})]);
  ids.forEach(id=>{const p=(a.players||{})[id],q=(b.players||{})[id];out.players[id]=!p?q:!q?p:((q.t||0)>(p.t||0)?q:p)});
  return out;
}
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));document.documentElement.classList.toggle('home',id==='home'||id==='perm');try{sndUI()}catch(e){}}
const needG=()=>{toast(t('needJoin'));startGps()};
$('bJoin').onclick=()=>{if(!gpsOk())return needG();openEntry('join')};
$('bHost').onclick=()=>{if(!gpsOk())return needG();openEntry('host')};
$('back').onclick=()=>show('home');
function openEntry(m){mode=m;$('err').textContent='';applyLang();show('entry')}

$('go').onclick=async()=>{
  const n=$('name').value.trim(),c=$('code').value.trim().toUpperCase();
  if(!n){$('err').textContent=t('nameErr');return}
  if(c.length<3){$('err').textContent=t('codeErr');return}
  me.name=n;
  try{
    let ex=await store.get(c);
    if(ex&&deadRoom(ex)){try{await store.del(c)}catch(e){}ex=null}
    if(mode==='join'){
      if(!ex){$('err').textContent=t('nf');return}
      code=c;me.host=false;room=ex;
      ex.players[me.id]={name:n,team:'h',t:Date.now()};ex.hb=ex.hb||{};ex.hb[me.id]=Date.now();await store.set(c,ex);
    }else{
      if(ex){$('err').textContent=t('taken');return}
      code=c;me.host=true;
      room={host:me.id,radius:350,custom:false,shape:null,zt:0,hb:{[me.id]:Date.now()},players:{[me.id]:{name:n,team:'h',t:Date.now()}}};
      await store.set(c,room);
    }
  }catch(e){$('err').textContent=t('saveErr');return}
  $('lcode').textContent=code;seen=false;show('lobby');startGps();clearInterval(hbTimer);hbTimer=setInterval(hbTick,30000);
  unsub&&unsub();
  unsub=store.sub(code,d=>{
    if(d){seen=true;if(dragging)return;const m=room?merge(room,d):d;const sj=JSON.stringify(m);if(sj===lastS)return;lastS=sj;room=m;setTimeout(syncGame,0);
      
      render();
    }else if(seen&&!me.host){toast(t('closed'));goHome()}
  });
  render();
};

function goHome(){$('frz').style.display='none';clearInterval(hbTimer);stopGps();sensStop();musicStop();$('seen').style.display='none';outSince=0;oobHide();clearInterval(gtimer);clearInterval(ptimer);unsub&&unsub();unsub=null;room=null;code='';seen=false;show('home')}

async function mutate(fn){
  if(!room)return;
  const next=JSON.parse(JSON.stringify(room));fn(next);room=next;render();syncGame();
  try{
    let cur=await store.get(code);
    if(!cur){if(!me.host)return;cur=next}else cur=merge(cur,next);
    await store.set(code,cur);
  }catch(e){toast(t('saveErr')+' ('+((e&&(e.code||e.message))||'?')+')')}
}

function render(){
  if(!room||!$('lobby').classList.contains('on'))return;
  const r=room.radius,S=room.custom?shp(room):null,sh=S&&S.pts;
  $('zc').style.display=sh?'none':'flex';$('zp').style.display=sh?'block':'none';
  if(sh){drawPrev(S);$('zl').textContent=t('area')+': '+areaTxt(S)}
  else{const sz=Math.round(60+r/500*50);$('zc').style.width=$('zc').style.height=sz+'px';$('zc').textContent=r+' '+t('m');$('zl').textContent=''}
  const ch=$('chips');ch.innerHTML='';
  PRESETS.forEach(p=>ch.appendChild(chip(p+' '+t('m'),!sh&&r===p,()=>setZone(p))));
  ch.appendChild(chip(t('custom'),!!sh,openDraw));
  $('th').innerHTML='';$('ts').innerHTML='';

$('start').onclick=()=>{
  if(!gpsOk()){toast(t('needGps'));startGps();return}
  const S=room.custom?shp(room):null;
  const c=(S&&S.orig)||(gpos?{lat:gpos.lat,lon:gpos.lon}:null);
  mutate(x=>{Object.values(x.players).forEach(p=>{delete p.lost;delete p.caught;p.t=Date.now()});x.game={on:true,t:Date.now(),c,dur:room.dur||30,sr:room.sr||70}});
};
let lastReqT=0,kickId=null,lastPush=null,hbTimer=null;
function frzSync(){
  const g=room&&room.game,f=room&&room.frz;
  if(!g||!g.on||!f||f.g!==g.t||f.t===lastFrzT)return;
  lastFrzT=f.t;frzUntil=Date.now()+FRZ_MS;frzNext=Date.now()+FRZ_COOL;
  if(myTeam()==='h'){toast(t('frozenBan'));if(navigator.vibrate)navigator.vibrate([400,150,400])}
}
function deadRoom(r){const h=r.hb&&r.hb[r.host];return !h||Date.now()-h>300000}
function hbTick(){
  if(!room||!code||document.hidden)return;
  const now=Date.now();
  mutate(x=>{
    x.hb=x.hb||{};x.hb[me.id]=now;
    if(me.host&&!(x.game&&x.game.on)){
      Object.entries(x.players).forEach(([id,p])=>{
        if(id!==me.id&&!p.left&&x.hb[id]&&now-x.hb[id]>90000)x.players[id]={name:p.name,team:p.team,left:true,t:now};
      });
    }
  });
}
function openKick(id,name){kickId=id;$('kickT').textContent=t('kickQ').replace('{n}',name);$('kickM').style.display='flex'}
function kickCheck(){const mp=room&&room.players[me.id];if(mp&&mp.kicked&&!me.host){toast(t('kicked'));goHome()}}
$('kNo').onclick=()=>{$('kickM').style.display='none'};
$('kYes').onclick=()=>{
  $('kickM').style.display='none';const id=kickId;if(!id)return;
  mutate(x=>{const p=x.players[id];if(p){x.players[id]={name:p.name,team:p.team,left:true,kicked:true,t:Date.now()}}});
};
function reqSync(){
  const g=room&&room.game,q=room&&room.req;
  if(!g||!g.on||!q||q.g!==g.t||q.t===lastReqT)return;
  lastReqT=q.t;
  const mine=room.players[me.id];
  if(q.s==='p'&&q.id===me.id&&mine&&!mine.caught&&!mine.lost){
    $('askT').textContent=t('askT').replace('{n}',q.bn);$('catchM').style.display='flex';
  }
  if(q.s==='n'&&q.by===me.id)toast(t('denied').replace('{n}',q.nm));
}
$('bCatch').onclick=()=>{
  const L=$('pickL');L.innerHTML='';
  const hs=Object.entries(room.players).filter(([id,p])=>p.team==='h'&&!p.left&&!p.lost&&!p.caught);
  if(!hs.length){toast(t('noHiders'));return}
  hs.forEach(([id,p])=>{
    const b=document.createElement('button');b.textContent=p.name;
    b.onclick=()=>{
      $('pickM').style.display='none';
      mutate(x=>{x.req={id,nm:p.name,by:me.id,bn:me.name,t:Date.now(),g:x.game.t,s:'p'}});
      toast(t('sent').replace('{n}',p.name));
    };
    L.appendChild(b);
  });
  $('pickM').style.display='flex';
};
$('pickX').onclick=()=>$('pickM').style.display='none';
$('cYes').onclick=()=>{
  $('catchM').style.display='none';
  const now=Date.now();
  mutate(x=>{
    const p=x.players[me.id],q=x.req;
    if(p){p.caught={lat:gpos?gpos.lat:(p.lat==null?null:p.lat),lon:gpos?gpos.lon:(p.lon==null?null:p.lon),t:now};p.t=now}
    if(q)x.req={...q,s:'y',t:now};
  });
};
$('cNo').onclick=()=>{
  $('catchM').style.display='none';
  mutate(x=>{if(x.req)x.req={...x.req,s:'n',t:Date.now()}});
};
const hidersList=()=>Object.values(room.players).filter(p=>p.team==='h'&&!p.left);
function finishGame(res){mutate(x=>{x.game={on:false,t:Date.now(),c:null,res:res||null}})}
function showResult(){
  const r=room&&room.game&&room.game.res;if(!r)return;
  const win=(r==='s')===(myTeam()==='s');
  $('resT').textContent=t(win?'win':'lose');$('resT').style.color=win?'#2b9348':'#d00000';
  $('resS').textContent=t(r==='s'?'resS':'resH');
  $('resM').style.display='flex';if(navigator.vibrate)navigator.vibrate(300);
}
$('resOk').onclick=()=>$('resM').style.display='none';
$('gEnd').onclick=()=>{$('endM').style.display='flex'};
$('eNo').onclick=()=>{$('endM').style.display='none'};
$('eYes').onclick=()=>{$('endM').style.display='none';finishGame(null)};
const stp=v=>v<100?10:25;
$('sM').onclick=()=>mutate(x=>{const v=x.sr||70;x.sr=Math.max(10,v-stp(v-1));x.zt=Date.now()});
$('sP').onclick=()=>mutate(x=>{const v=x.sr||70;x.sr=Math.min(500,v+stp(v));x.zt=Date.now()});
$('dM').onclick=()=>mutate(x=>{x.dur=Math.max(5,(x.dur||30)-5);x.zt=Date.now()});
$('dP').onclick=()=>mutate(x=>{x.dur=Math.min(180,(x.dur||30)+5);x.zt=Date.now()});
$('leave').onclick=async()=>{
  const c=code,h=me.host;goHome();
  try{
    if(h)await store.del(c);
    else{const cur=await store.get(c);if(cur){cur.players[me.id]={name:me.name,team:'h',left:true,t:Date.now()};await store.set(c,cur)}}
  }catch(e){}
};
window.addEventListener('pagehide',()=>{if(me.host&&code)try{store.del(code)}catch(e){}});
// ---- напрямок телефона (стрілка на карті) ----
let heading=null,hdMk=null,hdT=0,sensOn=false;
const inGame=()=>{const c=document.querySelector('.scr.on');return !!c&&c.id==='game'};
function compassHeading(a,b,g){
  const x=b*Math.PI/180,y=g*Math.PI/180,z=a*Math.PI/180;
  const cY=Math.cos(y),cZ=Math.cos(z),sX=Math.sin(x),sY=Math.sin(y),sZ=Math.sin(z);
  const Vx=-cZ*sY-sZ*sX*cY,Vy=-sZ*sY+cZ*sX*cY;
  let h=Math.atan(Vx/Vy);if(Vy<0)h+=Math.PI;else if(Vx<0)h+=2*Math.PI;
  return h*180/Math.PI;
}
let relH=null,relOff=null,gotAbs=false,lastGpsHd=null;
function onOri(e){
  const n=Date.now();if(n-hdT<150)return;hdT=n;
  if(e.alpha==null||e.beta==null||e.gamma==null)return;
  const h=compassHeading(e.alpha,e.beta,e.gamma);if(isNaN(h))return;
  const abs=e.absolute===true||e.type==='deviceorientationabsolute';
  if(abs)gotAbs=true;else relH=h;
  if(!abs&&gotAbs)return;
  const v=abs?h:(relOff==null?null:(h+relOff)%360);
  if(v==null)return;
  heading=heading==null?v:(heading+(((v-heading+540)%360)-180)*0.35+360)%360;
  hdUpdate();
}
function curHd(){return heading!=null?heading:(lastGpsHd!=null?lastGpsHd:null)}
function hdUpdate(){
  const hv=curHd();
  if(!gmap||!gmap.ready||!gpos||hv==null||!inGame()){if(hdMk){hdMk.remove();hdMk=null}return}
  if(!hdMk){
    const el=document.createElement('div');el.className='hd';
    el.innerHTML='<svg viewBox="0 0 56 56" width="56" height="56"><path d="M28 3 L39 20 L28 15 L17 20 Z" fill="#1e78ff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>';
    hdMk=new maplibregl.Marker({element:el,rotationAlignment:'map',pitchAlignment:'map'}).setLngLat([gpos.lon,gpos.lat]).addTo(gmap);
  }
  hdMk.setLngLat([gpos.lon,gpos.lat]).setRotation(hv);
}
function sensStart(){if(sensOn)return;sensOn=true;window.addEventListener('deviceorientationabsolute',onOri,true);window.addEventListener('deviceorientation',onOri,true)}
function sensStop(){window.removeEventListener('deviceorientationabsolute',onOri,true);window.removeEventListener('deviceorientation',onOri,true);sensOn=false;heading=null;relH=null;relOff=null;gotAbs=false;if(hdMk){hdMk.remove();hdMk=null}}

// ---- прихована тема і музика ----
const bgm=$('bgm'),root=document.documentElement;
let useBd=false,muted=false,bgmMissing=false,pend=false,tapN=0,tapT=0;
try{localStorage.removeItem('hh_bnd');muted=localStorage.getItem('hh_mute')==='1'}catch(e){}
function sndUI(){
  const sp='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/>';
  $('snd').innerHTML=sp+(muted?'<path d="M3 3l18 18"/>':'<path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>')+'</svg>';
  $('snd').classList.toggle('on',useBd&&inGame()&&!bgmMissing);
}
function applyBnd(){root.classList.toggle('bnd',useBd);mapTheme(dmap);mapTheme(gmap);sndUI()}
bgm.addEventListener('error',()=>{bgmMissing=true;sndUI()});
function musicStart(){sndUI();if(!useBd||muted||bgmMissing)return;try{bgm.currentTime=0}catch(e){}const p=bgm.play();if(p&&p.catch)p.catch(()=>{pend=true})}
function musicStop(){bgm.pause();try{bgm.currentTime=0}catch(e){}pend=false;setTimeout(sndUI,50)}
function musicPause(){bgm.pause()}
function musicResume(){if(useBd&&!muted&&!bgmMissing&&inGame()){const p=bgm.play();if(p&&p.catch)p.catch(()=>{pend=true})}}
document.addEventListener('pointerdown',()=>{if(pend&&inGame()){pend=false;musicResume()}},true);
$('snd').onclick=()=>{muted=!muted;try{localStorage.setItem('hh_mute',muted?'1':'0')}catch(e){}if(muted)bgm.pause();else musicResume();sndUI()};
$('ttl').addEventListener('click',()=>{
  const n=Date.now();tapN=(n-tapT>2000)?1:tapN+1;tapT=n;
  if(tapN>=6){
    tapN=0;useBd=!useBd;try{localStorage.setItem('hh_bnd',useBd?'1':'0')}catch(e){}
    applyBnd();if(navigator.vibrate)navigator.vibrate(120);
    if(useBd){bgm.muted=true;const p=bgm.play();if(p&&p.then)p.then(()=>{bgm.pause();bgm.currentTime=0;bgm.muted=false}).catch(()=>{bgm.muted=false})}
  }
});
applyBnd();

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopGps();sensStop();musicPause();return}
  hbTick();
  if(inGame()){sensStart();musicResume()}
  const c=document.querySelector('.scr.on'),sc=c&&c.id;
  if(sc==='game'||sc==='draw'||(sc==='lobby'&&me.host))startGps();
});
applyLang();
</script>
