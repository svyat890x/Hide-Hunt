<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hide Hunt</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mut:#5d6b78;--ac:#e8590c;--hid:#2b7de9;--see:#d9480f;--grid:#d5dde4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--card:#1a242d;--tx:#eaf0f5;--mut:#9aa9b6;--ac:#ff8a3d;--hid:#5aa0ff;--see:#ff8a3d;--grid:#2c3a46}}
:root[data-theme="dark"]{--bg:#10171e;--card:#1a242d;--tx:#eaf0f5;--mut:#9aa9b6;--ac:#ff8a3d;--hid:#5aa0ff;--see:#ff8a3d;--grid:#2c3a46}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.scr{display:none;min-height:100%;max-width:480px;margin:0 auto;padding:20px;flex-direction:column;position:relative}
.scr.on{display:flex}
#home{justify-content:center;padding-bottom:18vh}
h1{font-size:44px;text-align:center;margin:0 0 28px}h1 span{color:var(--ac)}
h2{margin:0 0 14px}
button,input{font:inherit}
button{border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;background:var(--ac);color:#fff;width:100%;margin-bottom:12px}
button.sec{background:var(--grid);color:var(--tx)}
button:disabled{opacity:.45}
input[type=text]{width:100%;padding:16px;font-size:20px;border-radius:14px;border:2px solid var(--grid);background:var(--card);color:var(--tx);margin-bottom:12px}
#code{text-align:center;letter-spacing:6px;text-transform:uppercase;font-weight:700}
.err{color:#d00000;min-height:22px;margin-bottom:8px;font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pill{background:var(--card);border-radius:12px;padding:8px 14px;font-weight:700;letter-spacing:3px}
.chips{display:flex;gap:8px}
.chips button.chip{flex:1;width:auto;min-width:0;margin:0;padding:12px 4px;font-size:16px;background:var(--grid);color:var(--tx)}
.chips button.chip.sel{background:var(--ac);color:#fff}
.zone{display:flex;justify-content:center;align-items:center;height:130px}
.zone div{border:3px dashed var(--ac);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;transition:all .2s}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.team{background:var(--card);border-radius:16px;padding:12px;min-height:150px;border:2px solid transparent}
.team.over{border-color:var(--ac)}
.team h3{margin:0 0 8px;font-size:16px}
.team.h h3{color:var(--hid)}.team.s h3{color:var(--see)}
.pl{padding:10px 8px;margin-bottom:6px;border-radius:10px;background:var(--bg);user-select:none;-webkit-user-select:none}
.pl.me{font-weight:700}
.pl.mov{touch-action:none;cursor:grab}
.pl small{color:var(--mut);margin-left:4px}
.ghost{position:fixed;z-index:50;pointer-events:none;background:var(--ac);color:#fff;padding:10px 14px;border-radius:10px;font-weight:700;transform:translate(-50%,-50%);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.note{color:var(--mut);font-size:13px;text-align:center;margin-bottom:10px}
#gear{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:46px;height:46px;padding:0;margin:0;background:var(--card);color:var(--tx);display:flex;align-items:center;justify-content:center;border-radius:50%}
#lang{display:none;position:absolute;top:calc(68px + env(safe-area-inset-top,0px));right:14px;width:180px;background:var(--card);border-radius:14px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5}
#lang.on{display:block}
#lang button{margin:0 0 6px;padding:12px;font-size:16px}
#lang button:last-child{margin:0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:60;max-width:90%;text-align:center}
.map{position:relative;z-index:0;width:100%;height:min(58vh,480px);border-radius:14px;margin-bottom:12px;background:var(--card)}
.pt{width:26px;height:26px;border-radius:50%;background:#e8590c;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pd{width:18px;height:18px;border-radius:50%;border:2px solid #fff}
.pd b{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;color:var(--tx);text-shadow:0 0 3px var(--card),0 0 3px var(--card),0 0 3px var(--card)}
#oob{display:none;position:fixed;inset:0;z-index:55;background:rgba(220,20,20,.5);flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;font-size:24px;font-weight:800;padding:24px;pointer-events:none}
#oob span{font-size:84px;line-height:1.1}
.mod{display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:20px}
#pickL button{margin-bottom:8px}
#seen{display:none;position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:59;background:#e8590c;color:#fff;padding:12px 16px;border-radius:12px;text-align:center;font-weight:700}
#ban{display:none;position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:58;background:#c92a2a;color:#fff;padding:12px 16px;border-radius:12px;text-align:center;font-weight:700}
#warn{display:none;position:fixed;left:12px;right:12px;bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:57;background:#e8590c;color:#fff;padding:12px 16px;border-radius:12px;text-align:center;font-weight:700}
</style>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <h1>Hide <span>Hunt</span></h1>
  <div class="card"><b data-i="permT"></b><p data-i="permP" style="margin:8px 0 0;color:var(--mut)"></p></div>
  <button id="pAllow" data-i="allow"></button>

  <div id="lang"><button class="sec" data-l="uk">Українська</button><button class="sec" data-l="en">English</button><button class="sec" id="thBtn"></button></div>
  <h1>Hide <span>Hunt</span></h1>
  <button id="bJoin" data-i="join"></button>
  <button id="bHost" class="sec" data-i="host"></button>
  <div class="note" id="mode"></div>
</div>

<div id="entry" class="scr">
  <h2 id="etitle"></h2>
  <input type="text" id="name" data-p="name" maxlength="14" autocomplete="off">
  <input type="text" id="code" maxlength="6" autocomplete="off">
  <div class="err" id="err"></div>
  <button id="go" data-i="next"></button>
  <button class="sec" id="back" data-i="back"></button>
</div>

<div id="lobby" class="scr">
  <div class="top"><h2 style="margin:0" data-i="lobby"></h2><div class="pill" id="lcode"></div></div>
  <div class="card">
    <b data-i="zone"></b>
    <div class="zone"><div id="zc"></div><canvas id="zp" width="520" height="260" style="display:none;width:260px;height:130px"></canvas></div><div class="note" id="zl"></div>
    <div class="chips" id="chips"></div>
    
  </div>
  <div class="card"><b data-i="dur"></b><div class="chips" style="align-items:center;margin-top:10px"><button class="chip" id="dM">−</button><b id="dv" style="flex:2;text-align:center;font-size:22px"></b><button class="chip" id="dP">+</button></div></div>
  <div class="card"><b data-i="srT"></b><div class="chips" style="align-items:center;margin-top:10px"><button class="chip" id="sM">−</button><b id="sv" style="flex:2;text-align:center;font-size:22px"></b><button class="chip" id="sP">+</button></div></div>
  <div class="note" data-i="drag"></div>
  <div class="teams">
    <div class="team h" data-t="h"><h3 data-i="hiders"></h3><div id="th"></div></div>
    <div class="team s" data-t="s"><h3 data-i="seekers"></h3><div id="ts"></div></div>
  </div>
  <button id="start" data-i="start"></button>
  <button class="sec" id="leave" data-i="leave"></button>
</div>
<div id="draw" class="scr">
  <h2 data-i="drawT"></h2><div class="note" data-i="drawH"></div>
  <div id="dmap" class="map"></div>
  <div class="chips" style="margin-bottom:12px"><button class="chip" id="bU" data-i="undo"></button><button class="chip" id="bC" data-i="clear"></button><button class="chip" id="bZm">−</button><button class="chip" id="bZp">+</button></div>
  <div class="note" id="gst"></div>
  
  <button id="dDone" data-i="done"></button>
  <button class="sec" id="dCancel" data-i="cancel"></button>
</div>
<div id="game" class="scr">
  <div class="top"><h2 style="margin:0" id="gteam"></h2><button id="bCatch" data-i="catchBtn" style="display:none;width:auto;margin:0 8px;padding:10px 16px;font-size:16px"></button><div class="pill" id="gcode"></div></div>
  <div id="gmap" class="map"></div>
  <div class="note" id="gmsg" style="font-weight:600"></div>
  <button id="bShow" style="display:none"></button>
  <button class="sec" id="gEnd" data-i="endGame" style="display:none"></button>
</div>
<div id="seen"></div>
<div id="kickM" class="mod"><div class="card" style="width:100%;max-width:380px"><h2 id="kickT" style="font-size:20px"></h2><button id="kYes" data-i="kick"></button><button class="sec" id="kNo" data-i="cancel"></button></div></div>
<div id="endM" class="mod"><div class="card" style="width:100%;max-width:380px"><h2 data-i="endQ" style="font-size:20px"></h2><button id="eYes" data-i="yes"></button><button class="sec" id="eNo" data-i="no"></button></div></div>
<div id="resM" class="mod"><div class="card" style="width:100%;max-width:380px;text-align:center"><h2 id="resT" style="font-size:30px"></h2><p id="resS" style="color:var(--mut)"></p><button id="resOk" data-i="ok"></button></div></div>
<div id="pickM" class="mod"><div class="card" style="width:100%;max-width:380px"><h2 data-i="pickT"></h2><div id="pickL"></div><button class="sec" id="pickX" data-i="cancel"></button></div></div>
<div id="catchM" class="mod"><div class="card" style="width:100%;max-width:380px"><h2 id="askT" style="font-size:20px"></h2><button id="cYes" data-i="yes"></button><button class="sec" id="cNo" data-i="no"></button></div></div>
<div id="oob"><b id="oobT"></b><span id="oobS"></span></div>
<div id="ban"></div>
<div id="warn"></div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const T={
uk:{join:'Приєднатись до гри',host:'Створити гру',name:'Твоє ім’я',codeJ:'ВВЕДИ КОД',codeH:'ПРИДУМАЙ КОД',next:'Далі',back:'Назад',nameErr:'Введи ім’я',codeErr:'Код мінімум 3 символи',nf:'Кімнату з таким кодом не знайдено',taken:'Цей код уже зайнятий, придумай інший',lobby:'Лобі',zone:'Зона гри',custom:'Свій',m:'м',drag:'Перетягуй імена між командами. Хост може торкнутись імені, щоб вигнати гравця.',hiders:'Hide',seekers:'Hunt',hostTag:'хост',start:'Почати гру',soon:'Далі зробимо сам процес гри: GPS, радар і пошук.',leave:'Вийти',closed:'Хост закрив кімнату',demo:'Демо-режим: лише цей пристрій',saveErr:'Не вдалося зберегти зміни',drawT:'Малюємо зону',drawH:'Торкайся карти, щоб ставити кути зони. Кут можна перетягувати, торкнись кута, щоб видалити.',undo:'Скасувати',clear:'Стерти',done:'Готово',cancel:'Відміна',minPts:'Постав щонайменше 3 точки',area:'Площа',gpsBtn:'Дозволити GPS',gpsOn:'GPS працює',gpsOff:'GPS недоступний на цьому пристрої',gpsDeny:'Доступ до GPS заборонено. Дозволь його в налаштуваннях.',permT:'Точна геолокація',permP:'Hide Hunt використовує твою точну геолокацію (GPS), щоб показувати зону гри та надсилати твою позицію у грі. Під час гри мисливці можуть на кілька секунд побачити приблизне місце твого знаходження.',allow:'Дозволити геолокацію',skip:'Не зараз',show:'Show',showing:'Показуємо',shown:'Мисливці щойно побачили твою приблизну геолокацію!',endGame:'Завершити гру',gHide:'Ти ховаєшся',gHunt:'Ти шукаєш',waitGps:'Чекаємо GPS…',outside:'Ти поза зоною гри!',needGps:'Увімкни GPS і дозволь доступ до геолокації, щоб почати гру',dur:'Тривалість раунду',min:'хв',timeUp:'Час вийшов!',needJoin:'Дозволь доступ до геолокації, щоб створити або приєднатись до гри'},
en:{join:'Join Game',host:'Host Game',name:'Your name',codeJ:'ENTER CODE',codeH:'CREATE CODE',next:'Next',back:'Back',nameErr:'Enter your name',codeErr:'Code needs at least 3 characters',nf:'No room found with this code',taken:'This code is already taken, pick another',lobby:'Lobby',zone:'Game zone',custom:'Custom',m:'m',drag:'Drag names between teams. The host can tap a name to kick a player.',hiders:'Hide',seekers:'Hunt',hostTag:'host',start:'Start game',soon:'Next we will build the game itself: GPS, radar and searching.',leave:'Leave',closed:'The host closed the room',demo:'Demo mode: this device only',saveErr:'Could not save changes',drawT:'Draw the zone',drawH:'Tap the map to place zone corners. Drag a corner to move it, tap a corner to remove it.',undo:'Undo',clear:'Clear',done:'Done',cancel:'Cancel',minPts:'Place at least 3 points',area:'Area',gpsBtn:'Allow GPS',gpsOn:'GPS is on',gpsOff:'GPS is not available on this device',gpsDeny:'GPS access was denied. Allow it in settings.',permT:'Precise location',permP:'Hide Hunt uses your precise GPS location to show the game zone and to send your position during the game. While playing, hunters can briefly see your approximate location.',allow:'Allow location',skip:'Not now',show:'Show',showing:'Showing',shown:'The hunters just saw your approximate location!',endGame:'End game',gHide:'You are hiding',gHunt:'You are hunting',waitGps:'Waiting for GPS…',outside:'You are outside the zone!',needGps:'Turn on GPS and allow location access to start the game',dur:'Round time',min:'min',timeUp:'Time’s up!',needJoin:'Allow location access to host or join a game'}};
let lang='en';try{lang=localStorage.getItem('hh_lang')||'en'}catch(e){}
T.uk.catchBtn='Знайшов';T.uk.pickT='Кого ти знайшов?';T.uk.noHiders='Немає кого ловити';T.uk.askT='{n} каже, що знайшов тебе. Це правда?';T.uk.yes='Так';T.uk.no='Ні';T.uk.sent='Запит надіслано: {n}';T.uk.denied='{n} відхилив запит';T.uk.caughtBan='знайдений!';T.uk.caughtSelf='Тебе знайшли. Ти поза грою';
T.en.catchBtn='Found';T.en.pickT='Who did you find?';T.en.noHiders='No one left to catch';T.en.askT='{n} says they found you. Is that true?';T.en.yes='Yes';T.en.no='No';T.en.sent='Request sent: {n}';T.en.denied='{n} denied the request';T.en.caughtBan='was found!';T.en.caughtSelf='You were found. You are out';
T.uk.win='Ваша команда перемогла!';T.uk.lose='Ваша команда програла';T.uk.resS='Усіх хайдерів знайдено';T.uk.resH='Час вийшов, а хайдери лишились непійманими';T.uk.endQ='Ви впевнені, що хочете завершити гру?';T.uk.ok='Добре';
T.en.win='Your team won!';T.en.lose='Your team lost';T.en.resS='All hiders were found';T.en.resH='Time ran out and hiders were not all found';T.en.endQ='Are you sure you want to end the game?';T.en.ok='OK';
T.uk.kickQ='Вигнати {n} з лобі?';T.uk.kick='Вигнати';T.uk.kicked='Тебе вигнали з кімнати';
T.en.kickQ='Kick {n} from the lobby?';T.en.kick='Kick';T.en.kicked='You were kicked from the room';
T.uk.themeL='Світла тема';T.uk.themeD='Темна тема';T.en.themeL='Light theme';T.en.themeD='Dark theme';
T.uk.srT='Радіус кола при Show';T.uk.leftZone='Ти покинув зону! Повернись, або програєш автоматично через';T.uk.lostSelf='Ти програв: вийшов із зони';T.uk.lostBan='покинув зону й програв';
T.en.srT='Show circle radius';T.en.leftZone='You left the zone! Come back or you lose automatically in';T.en.lostSelf='You lost: left the zone';T.en.lostBan='left the zone and lost';
T.uk.warnZone='До межі зони {n} м. Тут можна бути, але не йди далі: вийдеш із зони й програєш.';T.en.warnZone='{n} m to the zone edge. You can stay here, but don’t go further: leaving the zone means you lose.';
const t=k=>T[lang][k];
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
  $('code').placeholder=t(mode==='join'?'codeJ':'codeH');
  $('etitle').textContent=t(mode==='join'?'join':'host');
  if(storeIsLocal)$('mode').textContent=t('demo');
  themeUI();
  if(room)render();
}
let theme=null;try{theme=localStorage.getItem('hh_theme')}catch(e){}
if(theme)document.documentElement.dataset.theme=theme;
const isDark=()=>theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function mapTheme(m){
  if(!m||!m.ready)return;const d=isDark();
  m.setPaintProperty('bg','background-color',d?'#161e26':'#eef1f4');
  m.setPaintProperty('w','fill-color',d?'#0c1217':'#cfdae4');
  m.setPaintProperty('r','line-color',d?'#68788a':'#a9b4bf');
}
function themeUI(){$('thBtn').textContent=t(isDark()?'themeL':'themeD')}
$('thBtn').onclick=()=>{
  theme=isDark()?'light':'dark';document.documentElement.dataset.theme=theme;
  try{localStorage.setItem('hh_theme',theme)}catch(e){}
  $('lang').classList.remove('on');themeUI();mapTheme(dmap);mapTheme(gmap);
};
$('gear').onclick=()=>$('lang').classList.toggle('on');
document.querySelectorAll('#lang button[data-l]').forEach(b=>b.onclick=()=>{
  lang=b.dataset.l;try{localStorage.setItem('hh_lang',lang)}catch(e){}
  $('lang').classList.remove('on');applyLang();
});
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}

const TEST_MODE=true; // true = можна входити без GPS (для тесту). Для справжньої гри постав false
const gpsOk=()=>TEST_MODE||!!gpos;
const PRESETS=[150,350,500];
const me={id:Math.random().toString(36).slice(2,10),name:'',host:false};
let code='',room=null,unsub=null,store=null,mode='host',storeIsLocal=true,seen=false,dragging=false,lastS='';

// ---- сховище: спільна база (db) або локальна демо-пам’ять ----
const mem={},listeners={};
const local={
  async get(c){return mem[c]?JSON.parse(JSON.stringify(mem[c])):null},

        if(p.lost){items.push(['x',p.name,p.lost.lon,p.lost.lat]);return}
        if(id===me.id||p.lat==null)return;
        if(p.team===mt)items.push(['t',p.name,p.lon,p.lat]);
        else if(mt==='s'&&showing&&p.team==='h'){
          const [x,y]=rel(p,C),sd=hash(id+(room.show?room.show.t:0)),a=(sd%360)*Math.PI/180,d=(sd>>3)%Math.max(1,Math.round(SR*.7));
          const q=m2ll(x+Math.cos(a)*d,y+Math.sin(a)*d,C);items.push(['f',p.name,q[0],q[1]]);
        }
      });
      const sig=JSON.stringify(items)+mt;
      if(sig!==gsig){
        gsig=sig;gmk.forEach(m=>m.remove());gmk=[];
        const fz=[];
        items.forEach(([k,n,lo,la])=>{
          const f=k==='f';
          if(f)fz.push({type:'Feature',geometry:{type:'Polygon',coordinates:[circ(la,lo,SR)]}});
          const el=mkEl(f?'transparent':k==='x'?'#e03131':k==='c'?'#868e96':(mt==='s'?'#d9480f':'#2b7de9'),k==='x'?'✖ '+n:k==='c'?'✔ '+n:n);if(f)el.style.border='0';
          gmk.push(new maplibregl.Marker({element:el}).setLngLat([lo,la]).addTo(gmap));
        });
        gmap.getSource('fz').setData(FC(fz));
      }
      if(gpos){
        setMe(gmap);
        const [ux,uy]=rel(gpos,C),inn=inside(ux,uy),mine=room.players[me.id];
        $('warn').style.display='none';
        if(mine&&mine.caught){msg=t('caughtSelf');oobHide()}
        else if(mine&&mine.lost){msg=t('lostSelf');oobHide()}
        else{
          msg=inn?t(mt==='s'?'gHunt':'gHide'):t('outside');
          if(inn){outSince=0;oobHide();const d=edgeD(ux,uy);if(d<=WARN_M){$('warn').textContent=t('warnZone').replace('{n}',Math.max(1,Math.round(d)));$('warn').style.display='block'}}
          else if(gpos.acc<=150){
            if(!outSince)outSince=Date.now();
            const left=Math.ceil(5-(Date.now()-outSince)/1000);
            if(left>0){$('oobT').textContent=t('leftZone');$('oobS').textContent=left;$('oob').style.display='flex'}
            else{outSince=0;oobHide();mutate(x=>{const p=x.players[me.id];if(p&&!p.lost){p.lost={lat:gpos.lat,lon:gpos.lon,t:Date.now()};p.t=Date.now()}})}
          }
        }
      }
    }
  }
  const gg=room.game,rem=Math.max(0,(gg.dur||30)*60000-(Date.now()-gg.t));
  const mm=Math.floor(rem/60000),ss=Math.floor(rem%60000/1000);
  $('gteam').textContent=(mt==='s'?'Hunt':'Hide')+' · '+mm+':'+String(ss).padStart(2,'0');
  if(rem<=0){msg=t('timeUp');if(me.host&&!ended){ended=true;const hl=hidersList();finishGame(!hl.length?null:hl.some(p=>!p.caught&&!p.lost)?'h':'s')}}
  else if(me.host&&!ended){const hl=hidersList(),hu=Object.values(room.players).filter(p=>p.team==='s'&&!p.left);
    if(hl.length&&hl.every(p=>p.caught||p.lost)){ended=true;finishGame('s')}
    else if(hu.length&&hu.every(p=>p.lost)){ended=true;finishGame('h')}}
  $('gmsg').textContent=msg;
  const se=$('seen'),sl=showUntil-Date.now();
  if(mt==='h'&&sl>0){se.textContent=t('shown')+' ('+Math.ceil(sl/1000)+' s)';se.style.display='block'}else se.style.display='none';
  const b=$('bShow');b.style.display=mt==='s'?'block':'none';const m2=room.players[me.id];$('bCatch').style.display=(mt==='s'&&!(m2&&(m2.lost||m2.caught)))?'block':'none';
  const now2=Date.now();
  if(now2<showUntil){b.disabled=true;b.textContent=t('showing')+' '+Math.ceil((showUntil-now2)/1000)+' s'}
  else if(now2<nextShow){b.disabled=true;b.textContent=t('show')+' ('+Math.ceil((nextShow-now2)/1000)+' s)'}
  else{b.disabled=false;b.textContent=t('show')}
}
$('bShow').onclick=()=>{
  if(Date.now()<nextShow||!room||!room.game)return;
  nextShow=Date.now()+COOL_MS;
  mutate(x=>{x.show={t:Date.now(),g:x.game.t}});
};
$('start').onclick=()=>{
  if(!gpsOk()){toast(t('needGps'));startGps();return}
  const S=room.custom?shp(room):null;
  const c=(S&&S.orig)||(gpos?{lat:gpos.lat,lon:gpos.lon}:null);
  mutate(x=>{Object.values(x.players).forEach(p=>{delete p.lost;delete p.caught;p.t=Date.now()});x.game={on:true,t:Date.now(),c,dur:room.dur||30,sr:room.sr||70}});
};
let lastReqT=0,kickId=null,lastPush=null;
function openKick(id,name){kickId=id;$('kickT').textContent=t('kickQ').replace('{n}',name);$('kickM').style.display='flex'}
function kickCheck(){const mp=room&&room.players[me.id];if(mp&&mp.kicked&&!me.host){toast(t('kicked'));goHome()}}
$('kNo').onclick=()=>{$('kickM').style.display='none'};
$('kYes').onclick=()=>{
  $('kickM').style.display='none';const id=kickId;if(!id)return;
  mutate(x=>{const p=x.players[id];if(p){x.players[id]={name:p.name,team:p.team,left:true,kicked:true,t:Date.now()}}});
};
function reqSync(){
  const g=room&&room.game,q=room&&room.req;
  if(!g||!g.on||!q||q.g!==g.t||q.t===lastReqT)return;
  lastReqT=q.t;
  const mine=room.players[me.id];
  if(q.s==='p'&&q.id===me.id&&mine&&!mine.caught&&!mine.lost){
    $('askT').textContent=t('askT').replace('{n}',q.bn);$('catchM').style.display='flex';
  }
  if(q.s==='n'&&q.by===me.id)toast(t('denied').replace('{n}',q.nm));
}
$('bCatch').onclick=()=>{
  const L=$('pickL');L.innerHTML='';
  const hs=Object.entries(room.players).filter(([id,p])=>p.team==='h'&&!p.left&&!p.lost&&!p.caught);
  if(!hs.length){toast(t('noHiders'));return}
  hs.forEach(([id,p])=>{
    const b=document.createElement('button');b.textContent=p.name;
    b.onclick=()=>{
      $('pickM').style.display='none';
      mutate(x=>{x.req={id,nm:p.name,by:me.id,bn:me.name,t:Date.now(),g:x.game.t,s:'p'}});
      toast(t('sent').replace('{n}',p.name));
    };
    L.appendChild(b);
  });
  $('pickM').style.display='flex';
};
$('pickX').onclick=()=>$('pickM').style.display='none';
$('cYes').onclick=()=>{
  $('catchM').style.display='none';
  const now=Date.now();
  mutate(x=>{
    const p=x.players[me.id],q=x.req;
    if(p){p.caught={lat:gpos?gpos.lat:(p.lat==null?null:p.lat),lon:gpos?gpos.lon:(p.lon==null?null:p.lon),t:now};p.t=now}
    if(q)x.req={...q,s:'y',t:now};
  });
};
$('cNo').onclick=()=>{
  $('catchM').style.display='none';
  mutate(x=>{if(x.req)x.req={...x.req,s:'n',t:Date.now()}});
};
const hidersList=()=>Object.values(room.players).filter(p=>p.team==='h'&&!p.left);
function finishGame(res){mutate(x=>{x.game={on:false,t:Date.now(),c:null,res:res||null}})}
function showResult(){
  const r=room&&room.game&&room.game.res;if(!r)return;
  const win=(r==='s')===(myTeam()==='s');
  $('resT').textContent=t(win?'win':'lose');$('resT').style.color=win?'#2b9348':'#d00000';
  $('resS').textContent=t(r==='s'?'resS':'resH');
  $('resM').style.display='flex';if(navigator.vibrate)navigator.vibrate(300);
}
$('resOk').onclick=()=>$('resM').style.display='none';
$('gEnd').onclick=()=>{$('endM').style.display='flex'};
$('eNo').onclick=()=>{$('endM').style.display='none'};
$('eYes').onclick=()=>{$('endM').style.display='none';finishGame(null)};
const stp=v=>v<100?10:25;
$('sM').onclick=()=>mutate(x=>{const v=x.sr||70;x.sr=Math.max(10,v-stp(v-1));x.zt=Date.now()});
$('sP').onclick=()=>mutate(x=>{const v=x.sr||70;x.sr=Math.min(500,v+stp(v));x.zt=Date.now()});
$('dM').onclick=()=>mutate(x=>{x.dur=Math.max(5,(x.dur||30)-5);x.zt=Date.now()});
$('dP').onclick=()=>mutate(x=>{x.dur=Math.min(180,(x.dur||30)+5);x.zt=Date.now()});
$('leave').onclick=async()=>{
  const c=code,h=me.host;goHome();
  try{
    if(h)await store.del(c);
    else{const cur=await store.get(c);if(cur){cur.players[me.id]={name:me.name,team:'h',left:true,t:Date.now()};await store.set(c,cur)}}
  }catch(e){}
};
window.addEventListener('pagehide',()=>{if(me.host&&code)try{store.del(code)}catch(e){}});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopGps();return}
  const c=document.querySelector('.scr.on'),sc=c&&c.id;
  if(sc==='game'||sc==='draw'||(sc==='lobby'&&me.host))startGps();
});
applyLang();
</script>
</body>
</html>
